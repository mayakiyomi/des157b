<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockbuster Video</title>
    <!-- normalize css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@1,9..40,300&display=swap" rel="stylesheet">
    <!-- fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- css -->
    <link href="styles.css" rel="stylesheet">
    <!-- Meta tag for mobile support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- js -->

</head>
<body>
    <video id="myVideo" autoplay loop muted playsinline>
        <source src="media/waves.webm" type="video/webm">
        <source src="media/waves.mp4" type="video/mp4">

        <p>Your browser doesn't support HTML5 video. Here is a <a href="media/waves.mp4">link to the video</a>
            instead.</p>
    </video>
    <section id="mySection">
        <p id = "line1">clear water</p>
        <p id = "line2">still water</p>
        <p id = "line3">we can both wade</p>

    </section>
    

    <i class="fas fa-expand"></i>
</body>
</html>
