<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniStudio 2: Check Yourself</title>
    <!-- normalize css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Hanken+Grotesk&display=swap" rel="stylesheet">
    <!-- css -->
    <link href="styles.css" rel="stylesheet">

    <!-- js -->
     <script src = 'script.js' defer></script>
</head>
<body>
    <main>
        <section id = 'title'>
            <h1>
                CHECK YOURSELF
            </h1>
            <h2>
                how many hours of sleep i got & why 
            </h2>
            <h3>hover over a bar to see my sleep stats from the week!</h3>
        </section>

        <section id = 'data'>
            
            <div id = 'stats'>
                <h3 id = 'stat-date'></h3>
                <p id = 'stat-time'></p>
                <p id = 'stat-hours'></p>
                <p id = 'stat-reason'></p>
            </div>
            <div id="chart">

            </div> 
        </section>
    </main>
</body>
</html>
